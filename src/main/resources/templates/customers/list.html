<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html}">
<head>
    <title>Customers</title>
</head>
<body>
    <!-- Page title -->
    <h1 id="pageTitle">Customers</h1>

    <!-- Page header -->
    <h1 id="pageHeader">Customer Management</h1>

    <!-- Main content -->
    <div id="mainContent">
        <!-- Action buttons -->
        <div class="mb-4">
            <a href="/customers/new" class="btn btn-primary">
                <i class="fas fa-user-plus me-2"></i> Add New Customer
            </a>
        </div>

        <!-- Customers table -->
        <div class="card shadow">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Address</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="customer : ${customers}">
                                <td th:text="${customer.id}">1</td>
                                <td th:text="${customer.fullName}">John Doe</td>
                                <td th:text="${customer.email}">john@example.com</td>
                                <td th:text="${customer.phone}">1234567890</td>
                                <td th:text="${customer.address}">123 Main St</td>
                                <td>
                                    <a th:href="@{/customers/{id}/edit(id=${customer.id})}" class="btn btn-sm btn-primary">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/customers/{id}/delete(id=${customer.id})}" 
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('Are you sure you want to delete this customer?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <!-- If no customers -->
                            <tr th:if="${#lists.isEmpty(customers)}">
                                <td colspan="6" class="text-center">No customers found</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
